appId: digital.protohub.sendix
productName: Sendix
copyright: Copyright © 2026 Luis E. Bautista
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true

# Electron fuses, flipped in the packaged binary (see README, Seguridad).
electronFuses:
  runAsNode: false                            # the engine is a utilityProcess, not ELECTRON_RUN_AS_NODE
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false     # the UI is served from app://, never file://

# Icon and version info go into Sendix.exe in this hook instead of electron-builder's
# signAndEditExecutable step, which fails here on a transient file lock (see the hook).
afterPack: build/after-pack.cjs

# sendix:// for links from Mockix («Abrir en Sendix»). build/installer.nsh registers it
# for the current user and removes it on uninstall only if it still points here.
protocols:
  - name: Sendix
    schemes: [sendix]

# Auto-update from GitHub Releases (electron-updater): the app checks on start and from the Sistema tab.
publish:
  provider: github
  owner: LuisEBautistaR
  repo: sendix
  releaseType: release

win:
  signAndEditExecutable: false
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: Sendix-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Sendix
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  deleteAppDataOnUninstall: false
