syntax = "proto3";

package tienda.v1;

import "comun/dinero.proto";
import "google/protobuf/timestamp.proto";

// Catálogo y pedidos de una tienda de prueba.
service Tienda {
  rpc ObtenerProducto (ProductoId) returns (Producto);
  rpc ListarProductos (Filtro) returns (stream Producto);
  rpc CargarPedido (stream LineaPedido) returns (Resumen);
  rpc Chat (stream Mensaje) returns (stream Mensaje);
}

enum Categoria {
  CATEGORIA_DESCONOCIDA = 0;
  CAFE = 1;
  TE = 2;
}

message ProductoId { string id = 1; }

message Producto {
  string id = 1;
  string nombre = 2;
  Categoria categoria = 3;
  tienda.comun.Dinero precio = 4;
  repeated string etiquetas = 5;
  google.protobuf.Timestamp alta = 6;
}

message Filtro {
  Categoria categoria = 1;
  int32 limite = 2;
}

message LineaPedido {
  string producto_id = 1;
  int32 cantidad = 2;
}

message Resumen {
  int32 lineas = 1;
  int32 unidades = 2;
}

message Mensaje {
  string texto = 1;
}
